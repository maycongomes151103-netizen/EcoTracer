name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore EcoTracer.slnx
      - name: Build
        run: dotnet build EcoTracer.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test EcoTracer.slnx --no-build --configuration Release --verbosity normal